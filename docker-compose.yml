services:
  app:
    build: .
    image: myproject:local
    container_name: myproject_app
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 2s      # <-- Check every 2 seconds instead of 10
      timeout: 3s       # <-- Fail fast if no response
      retries: 5        # <-- Allow a few quick retries
      start_period: 3s  # <-- Only wait 3 seconds before counting failures
    restart: unless-stopped

  # As approved by the instructor: Ngrok tunnel for Retell AI WebSockets
  ngrok:
    image: ngrok/ngrok:latest
    container_name: myproject_ngrok
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: "http app:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped