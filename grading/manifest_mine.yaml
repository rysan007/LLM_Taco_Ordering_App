# grading/manifest.yaml
# Pinning the environment for exact TA reproducibility. Required by the Design Pillar.

environment:
  python_version: "3.11.8"
  os: "linux"
  docker_base_image: "python:3.11-slim"

models:
  system1_foreground:
    provider: "google"
    model_id: "gemini-2.5-flash"
  system2_background:
    provider: "google"
    model_id: "gemini-2.5-pro"

data:
  menu_index_version: "v1.0.0"
  seed: 42

build:
  commit_sha: "HEAD" # Grading script will read the actual SHA here
